<!doctype html>
<html lang="{{ page.lang | default: site.lang }}" dir="{{ page.dir | default: site.direction | default: 'rtl' }}">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f0e8">
{% seo %}
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header class="site-header"><div class="container nav">
<a class="brand" href="{{ '/' | relative_url }}"><span class="brand__mark">م</span><span>{{ site.title }}</span></a>
<nav><a href="{{ '/' | relative_url }}">الرئيسية</a><a href="{{ '/about/' | relative_url }}">عنّي</a></nav>
<button class="theme-toggle" type="button" aria-label="تبديل المظهر">◐</button>
</div></header>
<main>{{ content }}</main>
<footer class="site-footer"><div class="container footer-grid"><div><div class="brand footer-brand"><span class="brand__mark">م</span><span>{{ site.title }}</span></div><p>{{ site.description }}</p></div><div class="footer-note">© {{ 'now' | date: "%Y" }} {{ site.author.name }}<br>كُتب بشغف.</div></div></footer>
<script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
</body></html>
