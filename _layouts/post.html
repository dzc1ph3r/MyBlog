---
layout: default
---
<article class="article">
<header class="article__header container--narrow">
<div class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>{% if page.category %}<span>·</span><span>{{ page.category }}</span>{% endif %}</div>
<h1>{{ page.title }}</h1>
{% if page.description %}<p class="article__lead">{{ page.description }}</p>{% endif %}
<div class="author-line"><img src="{{ site.author.avatar | relative_url }}" alt="{{ site.author.name }}"><span>{{ site.author.name }}</span></div>
</header>
{% if page.image %}<figure class="article__cover"><img src="{{ page.image | relative_url }}" alt="{{ page.title }}"></figure>{% endif %}
<div class="prose container--narrow">{{ content }}</div>
<div class="article-end container--narrow"><div class="end-mark">✦</div><p>شكرًا لقراءتك.</p></div>
</article>
